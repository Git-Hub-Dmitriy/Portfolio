name: Next.js CI Check (Guitro)

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Guitro

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ./Guitro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint
        continue-on-error: true

      - name: Build Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://mockuser:mockpassword@localhost:5432/mockdb?schema=public"
          NEXTAUTH_SECRET: "temporary-secret-only-for-github-actions-build-step"
